name: Build & Publish OSM Frontend

on:
  push:
    branches: [ release ]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  ORG: x-dev-grp                   # <- your GH org/owner
  IMAGE_NAME: osm-frontend         # package/image name
  IMAGE_TAG_MAIN: release-latest   # "stable" moving tag

permissions:
  contents: read
  packages: write                  # required to push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Angular production build for /osm
        run: npx ng build -c=production --base-href=/osm/ --deploy-url=/osm/

      - name: Upload built artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/**/*
          if-no-files-found: error

      - name: Extract package version
        id: pkg
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Prefer GITHUB_TOKEN; if your org policy needs a PAT, set GHCR_PAT secret and we use it instead
      - name: Login to GHCR (GITHUB_TOKEN)
        if: ${{ !secrets.GHCR_PAT }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR (PAT)
        if: ${{ secrets.GHCR_PAT }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_MAIN }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:v${{ steps.pkg.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NG_CONFIG=production
            BASE_HREF=/osm/
            DEPLOY_URL=/osm/

  # OPTIONAL: deploy to your VPS over SSH after the image is pushed
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref_name == 'release' || github.ref_name == 'main'
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}   # private key; add matching pubkey to /root/.ssh/authorized_keys on VPS
          script: |
            set -e
            cd /opt/osm/compose
            docker login ghcr.io -u ${{ secrets.GHCR_USER }} -p '${{ secrets.GHCR_PAT }}'
            docker compose pull web
            docker compose up -d web
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
