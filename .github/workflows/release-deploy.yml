name: FE Build (Angular)

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main, release ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (force)
        run: npm ci --force

      - name: Build for /osm
        run: npx ng build -c=production --base-href=/osm/ --deploy-url=/osm/

      # Discover the real outputPath from angular.json (e.g., "dist/ui" or "dist/<proj>/browser")
      - name: Detect Angular output directory
        id: outdir
        run: |
          OUT_DIR=$(node -e "const a=require('./angular.json'); const p=Object.keys(a.projects)[0]; process.stdout.write(a.projects[p].architect.build.options.outputPath)")
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "Detected output dir: $OUT_DIR"
          echo "Tree:" && ls -la "$OUT_DIR" || true

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ steps.outdir.outputs.out_dir }}/**
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # allow pushing to GHCR

    env:
      REGISTRY: ghcr.io
      ORG: x-dev-grp
      IMAGE_NAME: osm-frontend
      IMAGE_TAG_MAIN: release-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # If your org allows GITHUB_TOKEN for GHCR, this is enough.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package version
        id: pkg
        shell: bash
        run: |
                VERSION=$(node -e "console.log(require('./package.json').version)")
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build & push FE image (nginx serving /osm)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_MAIN }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:v${{ steps.pkg.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NG_CONFIG=production
            BASE_HREF=/osm/
            DEPLOY_URL=/osm/
