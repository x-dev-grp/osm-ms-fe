name: FE Build (Angular)

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main, release ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build for /osm
        run: npx ng build -c=production --base-href=/osm/ --deploy-url=/osm/

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          # Angular 16+: output is dist/<project>/browser/
          path: |
            dist/**/browser/**
          if-no-files-found: error
