name: Frontend CI

on:
  push:
    branches: [main, develop, release, pfe-v2-final]
  pull_request:
    branches: [main, develop, release, pfe-v2-final]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VERSION matches package.json
        run: |
          test -f VERSION
          V=$(tr -d '\r\n' < VERSION)
          P=$(node -p "require('./package.json').version")
          test "$V" = "$P" || (echo "VERSION ($V) != package.json ($P)" && exit 1)

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --no-progress

      - name: Production build
        run: npx ng build -c=production --base-href=/ --deploy-url=/

      - name: Detect output directory
        id: outdir
        run: |
          OUT_DIR=$(node -e "const a=require('./angular.json'); const p=Object.keys(a.projects)[0]; process.stdout.write(a.projects[p].architect.build.options.outputPath)")
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ steps.outdir.outputs.out_dir }}/**
          if-no-files-found: error
          retention-days: 3
