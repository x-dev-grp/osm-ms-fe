name: Feature branch CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
      - release

concurrency:
  group: feature-ci-fe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate VERSION matches package.json
        run: |
          test -f VERSION
          V=$(tr -d '\r\n' < VERSION)
          P=$(node -p "require('./package.json').version")
          test "$V" = "$P" || (echo "VERSION ($V) != package.json ($P)" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
