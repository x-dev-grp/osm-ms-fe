<div class="of-form-page">
  <div class="form-header">
    <button class="btn-back-floating" routerLink="/of">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div>
      <h2 class="form-title">Nouvel ordre de conditionnement</h2>
      <p class="form-subtitle">Planifiez votre production</p>
    </div>
  </div>

  <div *ngIf="loading" class="loading-container">
    <div class="spinner-border"></div>
    <p>Chargement...</p>
  </div>

  <div *ngIf="!loading" class="form-content">
    <form [formGroup]="ofForm" (ngSubmit)="onSubmit()">
      <div class="form-card">
        <h5 class="card-title">Informations générales</h5>
        <div class="form-row">
          <div class="form-group">
            <label>SKU (produit fini)</label>
            <select class="form-control" formControlName="skuId" required>
              <option value="" disabled>Choisir un SKU</option>
              <option *ngFor="let sku of skus" [value]="sku.id">{{ sku.code }}</option>
            </select>
            <div class="error" *ngIf="ofForm.get('skuId')?.invalid && ofForm.get('skuId')?.touched">
              Le SKU est requis
            </div>
            <div class="form-group">
              <label>BOM (Nomenclature)</label>
              <select class="form-control" formControlName="bomId" required>
                <option value="" disabled>-- Choisir une version de BOM --</option>
                <option *ngFor="let bom of boms" [value]="bom.id">
                  {{ bom.version }} ({{ bom.skuCode }})
                </option>
              </select>
              <div class="error" *ngIf="loadingBoms">Chargement des BOMs...</div>
              <div class="error" *ngIf="ofForm.get('bomId')?.hasError('required') && ofForm.get('bomId')?.touched">
                La BOM est requise
              </div>
              <div class="error" *ngIf="ofForm.get('bomId')?.hasError('noBom')">
                Aucune BOM trouvée pour ce SKU. Veuillez d'abord créer une BOM.
              </div>
              <div class="error" *ngIf="ofForm.get('bomId')?.hasError('serverError')">
                Erreur de chargement des BOMs. Veuillez réessayer.
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Ligne de conditionnement (optionnel)</label>
            <select class="form-control" formControlName="ligneId">
              <option value="">-- Aucune ligne --</option>
              <option *ngFor="let ligne of lignes" [value]="ligne.id">{{ ligne.nom }}</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Lot d'huile vrac (optionnel)</label>
            <input type="text" class="form-control" formControlName="lotVracId" placeholder="UUID du lot">
          </div>
          <div class="form-group">
            <label>Quantité cible</label>
            <input type="number" step="1" class="form-control" formControlName="quantiteCible" required>
            <div class="error" *ngIf="ofForm.get('quantiteCible')?.invalid && ofForm.get('quantiteCible')?.touched">
              Quantité cible requise
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Date début prévue</label>
            <input type="datetime-local" class="form-control" formControlName="dateDebutPrevue">
          </div>
          <div class="form-group">
            <label>Date fin prévue</label>
            <input type="datetime-local" class="form-control" formControlName="dateFinPrevue">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancel()">Annuler</button>
        <button type="submit" class="btn-save" [disabled]="ofForm.invalid || isSubmitting">
          <i class="fas fa-save"></i> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>
