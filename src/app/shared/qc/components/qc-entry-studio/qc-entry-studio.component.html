<div class="qc-studio" [class.compact]="compact">
  <div class="qc-studio__loading" *ngIf="loading">
    <mat-spinner diameter="36"></mat-spinner>
    <span>{{ 'CONTROLE_QUALITE.LOADING' | translate }}</span>
  </div>

  <div class="qc-studio__error" *ngIf="message && !loading" role="alert">
    <mat-icon>error_outline</mat-icon>
    <p>{{ message }}</p>
  </div>

  <div class="qc-studio__grid" *ngIf="!loading && !message && rules.length > 0" [class.rail-collapsed]="!railExpanded">
    <main class="qc-studio__main">
      <form [formGroup]="form">
        <section class="reception-form-section">
          <header class="reception-form-section__header">
            <mat-icon>tune</mat-icon>
            <h3>{{ 'CONTROLE_QUALITE.SECTIONS.PARAMETERS' | translate }}</h3>
            <span class="qc-studio__section-badge">{{ 'CONTROLE_QUALITE.COMPLIANCE.STANDARD' | translate }}</span>
          </header>
          <div class="reception-form-section__body">
            <div class="qc-studio__rules">
              <app-qc-rule-field
                *ngFor="let rule of rules"
                [rule]="rule"
                [control]="asControl(rule.ruleKey)"
                [compact]="compact"
              />
            </div>
          </div>
        </section>
      </form>

      <div class="qc-studio__actions" *ngIf="showSaveButton && !isReadOnly">
        <p
          class="qc-studio__save-hint"
          *ngIf="saveHintKey"
          [class.qc-studio__save-hint--muted]="isReadOnly"
        >
          <mat-icon>{{ isReadOnly ? 'lock' : 'info' }}</mat-icon>
          {{ saveHintKey | translate }}
        </p>
        <button
          mat-flat-button
          color="primary"
          type="button"
          (click)="onSave()"
          [disabled]="!canSave"
        >
          <mat-spinner *ngIf="saving" diameter="18"></mat-spinner>
          <mat-icon *ngIf="!saving">save</mat-icon>
          {{ 'CONFIGURATION.SITE.BTNS.SAVE' | translate }}
        </button>
      </div>
    </main>

    <app-qc-compliance-rail
      *ngIf="!compact"
      [summary]="summary"
      [expanded]="railExpanded"
      (expandedChange)="railExpanded = $event"
    />
  </div>
</div>
