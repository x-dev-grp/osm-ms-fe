<mat-form-field appearance="outline" class="w-100">
  <mat-label>
    {{ field().labelTranslatePath ? (field().labelTranslatePath | translate) : field().label }}
  </mat-label>

  <input
    matInput
    class="w-100"
    [placeholder]="field().labelTranslatePath ? (field().labelTranslatePath | translate) : field().label"
    [formControl]="formControl"
    [matAutocomplete]="auto"
    #autoTrigger="matAutocompleteTrigger"
  />

  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayWith"
    (optionsScroll)="scroll($event)"
    (optionSelected)="autoCompleteSelect($event.option.value)">
    @for (item of autoCompleteOptions?.data; track item?.id) {
      <mat-option [value]="item">
        {{ getValue(field()?.valuePath, item) }}
      </mat-option>
    }
  </mat-autocomplete>

  <!-- Clear button (suffix) -->
  <button
    *ngIf="formControl?.value !== null && formControl?.value !== undefined && formControl?.value !== ''"
    mat-icon-button
    matSuffix
    type="button"
    tabindex="-1"
    (click)="clearAutocomplete($event, autoTrigger)"
    [matTooltip]="'COMMON.CLEAR' | translate"
    aria-label="{{ 'COMMON.CLEAR' | translate }}">
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>
