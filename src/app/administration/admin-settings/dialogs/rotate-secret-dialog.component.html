<h2 mat-dialog-title>{{ 'ADMIN_SETTINGS.MAIL.ROTATE_TITLE' | translate: { label: data.label } }}</h2>

<mat-dialog-content>
  <p class="dialog-note">{{ (data.hintKey || 'ADMIN_SETTINGS.MAIL.ROTATE_HINT') | translate }}</p>
  <form [formGroup]="form" class="admin-form-grid">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'ADMIN_SETTINGS.MAIL.SECRET_VALUE' | translate }}</mat-label>
      <input matInput type="password" formControlName="value" autocomplete="new-password" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'ADMIN_SETTINGS.MAIL.REASON' | translate }}</mat-label>
      <input matInput formControlName="reason" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="submitting">
    {{ 'COMMON.CANCEL' | translate }}
  </button>
  <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="submitting">
    @if (submitting) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      {{ 'ADMIN_SETTINGS.MAIL.ROTATE_SUBMIT' | translate }}
    }
  </button>
</mat-dialog-actions>
