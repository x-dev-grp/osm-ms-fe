<mat-expansion-panel [(expanded)]="formOpen" hideToggle class="m-b-20">
  <mat-expansion-panel-header>
    <mat-panel-title>
      {{ isEditing ? 'Modifier le compte bancaire' : 'Ajouter un compte bancaire' }}
    </mat-panel-title>
  </mat-expansion-panel-header>

  <form class="bank-form" [formGroup]="bankForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <mat-form-field appearance="outline" class="col">
        <mat-label>RIB</mat-label>
        <input matInput formControlName="rib" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="col">
        <mat-label>IBAN</mat-label>
        <input matInput formControlName="iban" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="col">
        <mat-label>BIC / SWIFT</mat-label>
        <input matInput formControlName="bicSwift" />
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline" class="col">
        <mat-label>Nom de la banque</mat-label>
        <input matInput formControlName="bankName" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="col">
        <mat-label>Agence</mat-label>
        <input matInput formControlName="bankBranch" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="col">
        <mat-label>Devise</mat-label>
        <mat-select formControlName="currency">
          <mat-option *ngFor="let c of currencies" [value]="c">{{ c }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline" class="col">
        <mat-label>Type de compte</mat-label>
        <mat-select formControlName="accountType">
          <mat-option *ngFor="let t of accountTypes" [value]="t">{{ t }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-checkbox formControlName="active">Actif</mat-checkbox>
    </div>

    <div class="actions full-width">
      <button mat-flat-button color="primary" type="submit">
        {{ isEditing ? 'Mettre à jour' : 'Ajouter' }}
      </button>
      <button mat-stroked-button color="accent" type="button" (click)="cancel()">
        Annuler
      </button>
    </div>
  </form>
</mat-expansion-panel>

<osm-dashboard [config]="dashboardConfig" (applyAction)="handleAction($event)"> </osm-dashboard>
