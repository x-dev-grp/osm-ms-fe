<!-- view-expense.component.html -->
<div *ngIf="expense" class="invoice">
  <div class="invoice-header">
    <button mat-icon-button (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>
      Facture n° {{ expense.invoiceRef }}
    </h1>
  </div>
  <mat-divider></mat-divider>

  <div class="invoice-details">
    <p>
      <strong>Date :</strong>
      {{ expense.date | date:'shortDate' }}
    </p>
    <p>
      <strong>Nature :</strong>
      {{ expense.purchaseNature }}
    </p>
    <p>
      <strong>Objet :</strong>
      {{ expense.object || '-' }}
    </p>
  </div>

  <div class="invoice-amount">
    <h2>
      Montant : {{ expense.amount | number:'1.2-2' }} €
    </h2>
  </div>

  <div class="invoice-actions">
    <button mat-flat-button color="primary" (click)="onPrint()">
      <mat-icon>print</mat-icon>
      <span>Imprimer</span>
    </button>
  </div>
</div>
