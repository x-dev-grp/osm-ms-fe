<!-- DASHBOARD KPI CARDS -->
<div class="dashboard-kpis row">
  <div class="col-md-6 col-xxl-4">
    <app-earning-chart [color]="primaryColor" [data]="receptionsPerDay"
                       [earningValue]="totalReceptions.toString()" [headerTitle]="'DASHBOARD.KPIS.TOTAL_RECEPTIONS' | translate"
                       background="bg-primary-50" iconImage="#wallet-2" percentageValue=""
                       textColor="text-primary-500"></app-earning-chart>
  </div>
  <div class="col-md-6 col-xxl-4">
    <app-earning-chart [color]="warningColor" [data]="pendingReceptionsPerDay"
                       [earningValue]="pendingReceptions.toString()" [headerTitle]="'DASHBOARD.KPIS.PENDING_RECEPTIONS' | translate"
                       background="bg-warning-50" iconImage="#calendar" percentageValue=""
                       textColor="text-warning-500"></app-earning-chart>
  </div>
  <div class="col-md-6 col-xxl-4">
    <app-earning-chart [color]="successColor" [data]="completedReceptionsPerDay"
                       [earningValue]="completedReceptions.toString()" [headerTitle]="'DASHBOARD.KPIS.COMPLETED_RECEPTIONS' | translate"
                       background="bg-success-50" iconImage="#book" percentageValue=""
                       textColor="text-success-500"></app-earning-chart>
  </div>
  <!-- Lower KPI cards: show only the value, not a chart -->
  <div class="dashboard-kpis row">
    <div class="col-md-4 col-xxl-4">
      <app-card [cardTitle]="'DASHBOARD.KPIS.TOTAL_VOLUME' | translate">
        <div class="f-w-600 f-20 m-t-15">{{ totalVolume.toFixed(2) }}</div>
      </app-card>
    </div>
    <div class="col-md-4 col-xxl-4">
      <app-card [cardTitle]="'DASHBOARD.KPIS.AVG_VOLUME' | translate">
        <div class="f-w-600 f-20 m-t-15">{{ avgVolumePerReception.toFixed(2) }}</div>
      </app-card>
    </div>
    <div class="col-md-4 col-xxl-4">
      <app-card [cardTitle]="'DASHBOARD.KPIS.AVG_UNIT_PRICE' | translate">
        <div class="f-w-600 f-20 m-t-15">{{ formattedAvgUnitPrice }}</div>
      </app-card>
    </div>
    <div class="col-md-4 col-xxl-4">
      <app-card [cardTitle]="'DASHBOARD.KPIS.TOTAL_PAID' | translate">
        <div class="f-w-600 f-20 m-t-15">{{ formattedTotalPaidAmount }}</div>
      </app-card>
    </div>
    <div class="col-md-4 col-xxl-4">
      <app-card [cardTitle]="'DASHBOARD.KPIS.TOTAL_UNPAID' | translate">
        <div class="f-w-600 f-20 m-t-15">{{ formattedTotalUnpaidAmount }}</div>
      </app-card>
    </div>
    <div class="col-md-4 col-xxl-4">
      <app-card [cardTitle]="'DASHBOARD.KPIS.UNIQUE_SUPPLIERS' | translate">
        <div class="f-w-600 f-20 m-t-15">{{ uniqueSuppliers.toString() }}</div>
      </app-card>
    </div>
  </div>
</div>
<!-- DASHBOARD ANALYTICS SECTION -->
<div class="dashboard-analytics row">
  <!-- Left Column: Main Analytics -->
  <div class="col-lg-8">
    <app-card [cardTitle]="'DASHBOARD.ANALYTICS.RECEPTION_TREND.TITLE' | translate">
      <div class="d-flex justify-content-between mb-3">
        <div class="btn-group">
          <button (click)="updateReceptionTrendView('monthly')" [class.active]="currentReceptionTrendView === 'monthly'"
                  mat-button>{{ 'DASHBOARD.ANALYTICS.RECEPTION_TREND.MONTHLY' | translate }}
          </button>
          <button (click)="updateReceptionTrendView('weekly')" [class.active]="currentReceptionTrendView === 'weekly'"
                  mat-button>{{ 'DASHBOARD.ANALYTICS.RECEPTION_TREND.WEEKLY' | translate }}
          </button>
          <button (click)="updateReceptionTrendView('daily')" [class.active]="currentReceptionTrendView === 'daily'"
                  mat-button>{{ 'DASHBOARD.ANALYTICS.RECEPTION_TREND.DAILY' | translate }}
          </button>
          <button (click)="updateChartSize('small')" [class.active]="currentChartSize === 'small'" mat-button>
            <mat-icon>crop_square</mat-icon>
          </button>
          <button (click)="updateChartSize('medium')" [class.active]="currentChartSize === 'medium'" mat-button>
            <mat-icon>crop_landscape</mat-icon>
          </button>
          <button (click)="updateChartSize('large')" [class.active]="currentChartSize === 'large'" mat-button>
            <mat-icon>crop_169</mat-icon>
          </button>
        </div>

      </div>
      <apx-chart [chart]="receptionsTrendChartOptions.chart" [colors]="receptionsTrendChartOptions.colors"
                 [series]="receptionsTrendChartOptions.series" [xaxis]="receptionsTrendChartOptions.xaxis"></apx-chart>
    </app-card>


    <app-card [cardTitle]="'DASHBOARD.ANALYTICS.VOLUME_BY_SUPPLIER' | translate">
      <apx-chart [chart]="volumeBySupplierChartOptions.chart" [colors]="volumeBySupplierChartOptions.colors"
                 [series]="volumeBySupplierChartOptions.series"
                 [xaxis]="volumeBySupplierChartOptions.xaxis"></apx-chart>
    </app-card>
    <app-card [cardTitle]="'DASHBOARD.ANALYTICS.RECENT_RECEPTIONS' | translate">
      <apx-chart
        [chart]="recentReceptionsChartOptions.chart"
        [colors]="recentReceptionsChartOptions.colors"
        [series]="recentReceptionsChartOptions.series"
        [tooltip]="recentReceptionsChartOptions.tooltip"
        [xaxis]="recentReceptionsChartOptions.xaxis"
        [yaxis]="recentReceptionsChartOptions.yaxis"
      ></apx-chart>
    </app-card>
  </div>
  <!-- Right Column: Supplier, Storage, Quality -->
  <div class="col-lg-4">

    <app-card [cardTitle]="'DASHBOARD.ANALYTICS.VOLUME_BY_STORAGE' | translate">
      <apx-chart [chart]="volumeByStorageChartOptions.chart" [colors]="volumeByStorageChartOptions.colors"
                 [series]="volumeByStorageChartOptions.series" [xaxis]="volumeByStorageChartOptions.xaxis"></apx-chart>
    </app-card>
    <app-card [cardTitle]="'DASHBOARD.ANALYTICS.RECEPTION_STATUS' | translate">
      <apx-chart [chart]="receptionsByStatusChartOptions.chart"
                 [colors]="receptionsByStatusChartOptions.colors"
                 [labels]="receptionsByStatusChartOptions.labels"
                 [series]="receptionsByStatusChartOptions.series"></apx-chart>
    </app-card>
    <app-card [cardTitle]="'DASHBOARD.ANALYTICS.QUALITY_CONTROL' | translate">
      <apx-chart [chart]="qualityControlChartOptions.chart"
                 [colors]="qualityControlChartOptions.colors"
                 [labels]="qualityControlChartOptions.labels"
                 [series]="qualityControlChartOptions.series"></apx-chart>
    </app-card>
    <app-card [cardTitle]="'DASHBOARD.ANALYTICS.RECEPTION_TYPE' | translate">
      <apx-chart [chart]="receptionsByTypeChartOptions.chart" [colors]="receptionsByTypeChartOptions.colors"
                 [series]="receptionsByTypeChartOptions.series"
                 [xaxis]="receptionsByTypeChartOptions.xaxis"></apx-chart>
    </app-card>
  </div>
</div>

  <div class="col-lg-12">

  </div>
</div>
