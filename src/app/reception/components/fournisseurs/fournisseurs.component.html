<!-- Expandable Panel for the Form -->
  <!-- The Form -->
  <mat-expansion-panel [(expanded)]="formOpen">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ isEditing ? 'Edit Supplier' : 'Add Supplier' }}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <form class="supplier-form"  style="padding: 0 15px 15px 15px;">
      <!-- Supplier Type FIRST -->
      <mat-form-field appearance="outline" class="w-100 m-b-10">
        <mat-label>Supplier Type</mat-label>
        <mat-select [(ngModel)]="selectedSupplier.suppliertype" name="suppliertype" required (selectionChange)="onSupplierTypeChange()">
          <mat-option *ngFor="let st of supplierTypes" [value]="st">
            {{ st.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Name -->
      <mat-form-field appearance="outline" class="w-100 m-b-10">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="selectedSupplier.name" name="name" required />
      </mat-form-field>

      <!-- Lastname -->
      <mat-form-field appearance="outline" class="w-100 m-b-10">
        <mat-label>Lastname</mat-label>
        <input matInput [(ngModel)]="selectedSupplier.lastname" name="lastname" />
      </mat-form-field>

      <!-- Phone -->
      <mat-form-field appearance="outline" class="w-100 m-b-10">
        <mat-label>Phone</mat-label>
        <input matInput [(ngModel)]="selectedSupplier.phone" name="phone" />
      </mat-form-field>

      <!-- Extended fields for Bawaz -->
      <ng-container *ngIf="isBawaz">
        <!-- Email -->
        <mat-form-field appearance="outline" class="w-100 m-b-10">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="selectedSupplier.email" name="email" />
        </mat-form-field>

        <!-- Address -->
        <mat-form-field appearance="outline" class="w-100 m-b-10">
          <mat-label>Address</mat-label>
          <input matInput [(ngModel)]="selectedSupplier.address" name="address" />
        </mat-form-field>

        <!-- Region -->
        <mat-form-field appearance="outline" class="w-100 m-b-10">
          <mat-label>Region</mat-label>
          <input matInput [(ngModel)]="selectedSupplier.region" name="region" />
        </mat-form-field>

        <!-- RIB -->
        <mat-form-field appearance="outline" class="w-100 m-b-10">
          <mat-label>RIB</mat-label>
          <input matInput [(ngModel)]="selectedSupplier.rib" name="rib" />
        </mat-form-field>

        <!-- Bank -->
        <mat-form-field appearance="outline" class="w-100 m-b-10">
          <mat-label>Bank</mat-label>
          <input matInput [(ngModel)]="selectedSupplier.bankName" name="bank" />
        </mat-form-field>
      </ng-container>

      <!-- Buttons -->
      <div class="form-row m-t-10" style="display: flex; gap: 10px;">
        <button mat-flat-button color="primary" (click)="onSubmit()">
          {{ isEditing ? 'Update Supplier' : 'Add Supplier' }}
        </button>
        <button
          *ngIf="isEditing"
          mat-stroked-button
          color="accent"
          type="button"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
      </div>
    </form>
  </mat-expansion-panel>

<!-- Table of suppliers below the form -->
<table mat-table [dataSource]="suppliers" class="mat-elevation-z8">
  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let supplier">{{ supplier.name }}</td>
  </ng-container>

  <!-- Lastname Column -->
  <ng-container matColumnDef="lastname">
    <th mat-header-cell *matHeaderCellDef> Lastname </th>
    <td mat-cell *matCellDef="let supplier">{{ supplier.lastname }}</td>
  </ng-container>

  <!-- Phone Column -->
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef> Phone </th>
    <td mat-cell *matCellDef="let supplier">{{ supplier.phone }}</td>
  </ng-container>

  <!-- Supplier Type -->
  <ng-container matColumnDef="supplierType">
    <th mat-header-cell *matHeaderCellDef> Supplier Type </th>
    <td mat-cell *matCellDef="let supplier">
      {{ supplier.suppliertype?.name || '-' }}
    </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let supplier">
      <button
        mat-icon-button
        color="primary"
        (click)="editSupplier(supplier)"
        matTooltip="Edit"
      >
        <mat-icon>edit</mat-icon>
      </button>
      <button
        mat-icon-button
        color="warn"
        (click)="deleteSupplier(supplier)"
        matTooltip="Delete"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Table rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
