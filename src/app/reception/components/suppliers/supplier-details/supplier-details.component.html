
<!-- History Cards -->
<div class="history-cards-container" >
  <div class="history-cards">
    <mat-card class="history-card" (click)="navigateToHistory('paid')">
      <mat-card-content>
        <div class="card-content">
          <mat-icon class="card-icon" color="primary">payments</mat-icon>
          <div class="card-info">
            <h3>Historique des Paiements</h3>
            <p>{{ paidCount }} paiements effectués</p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="history-card" (click)="navigateToHistory('unpaid')">
      <mat-card-content>
        <div class="card-content">
          <mat-icon class="card-icon" color="warn">pending_actions</mat-icon>
          <div class="card-info">
            <h3>Paiements en Attente</h3>
            <p>{{ unpaidCount }} paiements en attente</p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<!-- Supplier details dashboard -->
<osm-dashboard
  [config]="dashboardConfig"
  (applyAction)="handleAction($event)">
</osm-dashboard>
