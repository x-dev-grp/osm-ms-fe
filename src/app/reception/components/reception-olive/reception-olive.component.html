<!-- reception-olive-form.component.html -->
<div class="form-container">
  <h2>Formulaire de Réception Olive</h2>
  <form>
    <mat-form-field>
      <input matInput placeholder="Quantité (kg)" required>
    </mat-form-field>
    <mat-form-field>
      <input matInput placeholder="Date de réception" [matDatepicker]="picker" required>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <button mat-raised-button color="primary">Soumettre</button>
  </form>
</div>
