<h2 mat-dialog-title>Create New Olive Lot</h2>
<mat-dialog-content>
  <form [formGroup]="lotForm">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Lot Number</mat-label>
      <input matInput formControlName="lotNumber" required />
      <mat-error *ngIf="lotForm.get('lotNumber')?.hasError('required')">
        Lot Number is required
      </mat-error>
      <mat-error *ngIf="lotForm.get('lotNumber')?.hasError('nonUnique')">
        Lot Number must be unique
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Delivery Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="deliveryDate" required />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="lotForm.get('deliveryDate')?.hasError('required')">
        Delivery Date is required
      </mat-error>
      <mat-error *ngIf="lotForm.get('deliveryDate')?.hasError('pastDate')">
        Delivery Date cannot be in the past
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Delivery Number</mat-label>
      <input matInput formControlName="deliveryNumber" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Olive Quantity (kg)</mat-label>
      <input matInput type="number" formControlName="oliveQuantity" required />
      <mat-error *ngIf="lotForm.get('oliveQuantity')?.hasError('required')">
        Olive Quantity is required
      </mat-error>
      <mat-error *ngIf="lotForm.get('oliveQuantity')?.hasError('min')">
        Olive Quantity must be positive
      </mat-error>
      <mat-error *ngIf="lotForm.get('oliveQuantity')?.hasError('max')">
        Olive Quantity cannot exceed 10,000 kg
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onSubmit()" [disabled]="lotForm.invalid">Create</button>
</mat-dialog-actions>
