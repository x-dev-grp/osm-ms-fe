<div *ngIf="message" class="alert alert-danger text-center my-3">
  {{ message }}
</div>

<div *ngIf="isLoading" class="text-center my-3">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<form [formGroup]="dynamicForm" *ngIf="dynamicForm && !isLoading" class="quality-form container-fluid" (ngSubmit)="onSubmit()">
  <div class="row g-4 justify-content-center">
    <div class="col-sm-12 col-md-6 col-lg-4 d-flex" *ngFor="let control of dynamicForm.controls | keyvalue">
      <div class="rule-card flex-fill p-3 border rounded">
        <div class="rule-header mb-3">
          <label [for]="control.key" class="form-label fw-bold">
            {{ getRuleName(control.key) }}
          </label>
          <p class="rule-description">
            {{ getRuleDescription(control.key) }}
          </p>
        </div>

        <ng-container *ngIf="getRuleType(control.key) === 'NUMERIC'; else booleanOrSelectInput">
          <input
            type="number"
            class="form-control"
            [id]="control.key"
            [formControlName]="control.key"
            placeholder="Entrez une valeur"
          />
        </ng-container>

        <ng-template #booleanOrSelectInput>
          <ng-container *ngIf="isBooleanSelect(control.key); else checkboxInput">
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>{{ getRuleName(control.key) }}</mat-label>
              <mat-select [id]="control.key" [formControlName]="control.key">
                <mat-option [value]="true">Vrai</mat-option>
                <mat-option [value]="false">Faux</mat-option>
              </mat-select>
            </mat-form-field>
          </ng-container>
          <ng-template #checkboxInput>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [id]="control.key"
                [formControlName]="control.key"
              />
              <label class="form-check-label" [for]="control.key">
                {{ getRuleName(control.key) }}
              </label>
            </div>
          </ng-template>
        </ng-template>

        <!-- Validation Errors -->
        <div class="text-danger mt-2" *ngIf="(dynamicForm.get(control.key)?.invalid && (dynamicForm.get(control.key)?.touched || submitted))">
          <div *ngIf="dynamicForm.get(control.key)?.errors?.['required']">
            Ce champ est requis.
          </div>
          <div *ngIf="dynamicForm.get(control.key)?.errors?.['min']">
            La valeur doit être ≥ {{ getRuleMinValue(control.key) }}.
          </div>
          <div *ngIf="dynamicForm.get(control.key)?.errors?.['max']">
            La valeur doit être ≤ {{ getRuleMaxValue(control.key) }}.
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center my-4">
    <button class="btn btn-primary px-5" type="submit" [disabled]="dynamicForm.invalid || isLoading">
      Valider
    </button>
  </div>
</form>
