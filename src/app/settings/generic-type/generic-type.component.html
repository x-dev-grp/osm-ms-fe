<ng-template #genericTypeDialog>
  <h1 mat-dialog-title>
    {{
      currentRecord
        ? ('STANDARD.BTNS.EDIT' | translate)
        : ('STANDARD.BTNS.ADD' | translate)
    }}
  </h1>

  <div mat-dialog-content>
    <div class="col-12 align-items-center">
      <!-- bind your FormGroup here -->
      <form [formGroup]="dialogForm" mat-dialog-content>
        <div class="col-12 align-items-center">
          <div>
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Name</mat-label>
              <input formControlName="name" matInput placeholder="Enter name" />
            </mat-form-field>
          </div>
          <div>
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Description</mat-label>
              <input
                formControlName="description"
                matInput
                placeholder="Enter description"
              />
            </mat-form-field>
          </div>
          <!-- Dropdown: Always visible; pushed to the right -->
          <div>
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Select Type</mat-label>
              <mat-select (selectionChange)="onTypeChange($event.value)">
                <mat-option *ngFor="let type of typeOptions" [value]="type.value">
                  {{ type.name }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>

        <div align="end" mat-dialog-actions>
          <button (click)="onCancel()" mat-button>
            {{ 'STANDARD.BTNS.CANCEL' | translate }}
          </button>
          <button (click)="onSave()" [disabled]="dialogForm.invalid" color="primary" mat-flat-button>
            {{
              currentRecord
                ? ('STANDARD.BTNS.EDIT' | translate)
                : ('STANDARD.BTNS.ADD' | translate)
            }}
          </button>
        </div>
      </form>
    </div>
  </div>
</ng-template>

<div class="fab-container">
  <button
    (click)="openDialog()"
    aria-label="Add Generic Type"
    color="accent"
    mat-fab
  >
    <mat-icon>add</mat-icon>
  </button>
</div>

 <osm-dashboard #dashboard (applyAction)="applyAction($event)" [config]="dashboardConfig"></osm-dashboard>
