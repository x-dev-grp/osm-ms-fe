<!-- Expandable Panel for "Add Storage Unit" -->
<mat-expansion-panel [(expanded)]="formOpen" style="margin-bottom: 20px;">
  <mat-expansion-panel-header>
    <mat-panel-title>Add Storage Unit</mat-panel-title>
  </mat-expansion-panel-header>

  <form (ngSubmit)="onSubmit()" class="storage-form">
    <!-- Name -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="selectedStorageUnit .name" name="name" required />
    </mat-form-field>

    <!-- Location -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Location</mat-label>
      <input matInput [(ngModel)]="selectedStorageUnit .location" name="location" />
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" [(ngModel)]="selectedStorageUnit .description" name="description"></textarea>
    </mat-form-field>

    <!-- Max Capacity -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Max Capacity (L/Kg)</mat-label>
      <input matInput type="number" [(ngModel)]="selectedStorageUnit .maxCapacity" name="maxCapacity" />
    </mat-form-field>

    <!-- Current Volume -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Current Volume</mat-label>
      <input matInput type="number" [(ngModel)]="selectedStorageUnit .currentVolume" name="currentVolume" />
    </mat-form-field>

    <!-- Oil Type -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Oil Type</mat-label>
      <mat-select (selectionChange)="onSelectOliveVariety($event.value)" name="oilType">
        <mat-option *ngFor="let type of oilTypes" [value]="type.id">{{ type.name }}</mat-option>
      </mat-select>

    </mat-form-field>

    <!-- Status -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="selectedStorageUnit .status" name="status">
        <mat-option value="AVAILABLE">Available</mat-option>
        <mat-option value="FULL">Full</mat-option>
        <mat-option value="FILLING">FILLING</mat-option>
        <mat-option value="IN_USE">In Use</mat-option>
        <mat-option value="MAINTENANCE">Maintenance</mat-option>
        <mat-option value="CLEANING">CLEANING</mat-option>
        <mat-option value="RESERVED">RESERVED</mat-option>
        <mat-option value="OUT_OF_SERVICE">OUT_OF_SERVICE</mat-option>



      </mat-select>
    </mat-form-field>

    <!-- Maintenance / Inspection Dates -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Next Maintenance Date</mat-label>
      <input matInput [matDatepicker]="nextMaint" [(ngModel)]="selectedStorageUnit .nextMaintenanceDate"
             name="nextMaintenanceDate">
      <mat-datepicker-toggle matSuffix [for]="nextMaint"></mat-datepicker-toggle>
      <mat-datepicker #nextMaint></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Last Inspection Date</mat-label>
      <input matInput [matDatepicker]="lastInspect" [(ngModel)]="selectedStorageUnit   .lastInspectionDate"
             name="lastInspectionDate">
      <mat-datepicker-toggle matSuffix [for]="lastInspect"></mat-datepicker-toggle>
      <mat-datepicker #lastInspect></mat-datepicker>
    </mat-form-field>

    <!-- Submit Buttons -->
    <div style="grid-column: span 2; display: flex; gap: 10px; margin-top: 15px;">
      <button mat-flat-button color="primary" type="submit">Save</button>
      <button mat-stroked-button color="accent" type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</mat-expansion-panel>
