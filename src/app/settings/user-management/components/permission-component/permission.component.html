<div class="permissions-tree-container mat-elevation-z1">
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="permissions-tree">
    <!-- Tree node template for expandable nodes -->
    <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
      <div class="mat-tree-node">
        <button mat-icon-button 
                [attr.aria-label]="'Toggle ' + node?.permissionName"
                (click)="toggle(node)"  [disabled]="viewMode()">
          <mat-icon class="mat-icon-rtl-mirror">
            {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
          </mat-icon>
        </button>
        <mat-checkbox 
          [checked]="checklistSelection.isSelected(node)"
          [indeterminate]="descendantsPartiallySelected(node)"
          (change)="todoItemSelectionToggle(node)"  [disabled]="viewMode()">
          {{node?.permissionName}}
        </mat-checkbox>
      </div>
      
      <div class="nested-tree-node" *ngIf="treeControl.isExpanded(node)">
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
    </mat-nested-tree-node>

    <!-- Tree node template for leaf nodes -->
    <mat-tree-node *matTreeNodeDef="let node">
      <div class="mat-tree-node">
        <button mat-icon-button disabled></button>
        <mat-checkbox 
          [checked]="checklistSelection.isSelected(node)"
          (change)="todoLeafItemSelectionToggle(node)"  [disabled]="viewMode()">
          {{node?.permissionName}}
          
        </mat-checkbox>
      </div>
    </mat-tree-node>
  </mat-tree>
</div>
