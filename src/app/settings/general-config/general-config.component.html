<app-card [cardTitle]="'GENERAL_CONFIG.EXPANDABLE.CONFIGURATIONS' | translate" [showHeader]="true">
  <mat-tab-group (selectedTabChange)="onTabChange($event)">
    <mat-tab label="{{ 'GENERAL_CONFIG.TITLE' | translate }}">
      <app-company-profile></app-company-profile>
    </mat-tab>
    <mat-tab label="{{ 'GENERAL_CONFIG.EXPANDABLE.PRODUCTION_CONFIG' | translate }}">
      <!-- Production Config Section -->
      <form [formGroup]="productionConfigForm" (ngSubmit)="onSaveProductionConfig()" class="form-section">
        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="productionConfigForm.invalid || !productionConfigFormEnabled">
            <mat-icon>save</mat-icon>
            <span>{{ 'GENERAL_CONFIG.ACTIONS.SAVE' | translate }}</span>
          </button>
          <button mat-stroked-button color="warn" type="button" (click)="onResetProductionConfig()" [disabled]="!productionConfigFormEnabled">
            <mat-icon>undo</mat-icon>
            <span>{{ 'GENERAL_CONFIG.ACTIONS.RESET' | translate }}</span>
          </button>
          <button mat-stroked-button color="accent" type="button" (click)="enableProductionConfigForm()" *ngIf="!productionConfigFormEnabled">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
        </div>
      </form>
     </mat-tab>
    <mat-tab label="{{ 'GENERAL_CONFIG.EXPANDABLE.FINANCE_CONFIG' | translate }}">
      <!-- Finance Config Section -->
      <form [formGroup]="financeConfigForm" (ngSubmit)="onSaveFinanceConfig()" class="form-section">
        <mat-form-field appearance="outline" class="w-100 mb-3">
          <mat-label>Milling Price per Kg</mat-label>
          <input matInput formControlName="millingPricePerKg" type="number" min="0" step="0.01" [disabled]="!financeConfigFormEnabled" />
        </mat-form-field>
        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="financeConfigForm.invalid || !financeConfigFormEnabled">
            <mat-icon>save</mat-icon>
            <span>{{ 'GENERAL_CONFIG.ACTIONS.SAVE' | translate }}</span>
          </button>
          <button mat-stroked-button color="warn" type="button" (click)="onResetFinanceConfig()" [disabled]="!financeConfigFormEnabled">
            <mat-icon>undo</mat-icon>
            <span>{{ 'GENERAL_CONFIG.ACTIONS.RESET' | translate }}</span>
          </button>
          <button mat-stroked-button color="accent" type="button" (click)="enableFinanceConfigForm()" *ngIf="!financeConfigFormEnabled">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
        </div>
      </form>
      <!-- Removed generic type lists from here -->
    </mat-tab>
    <mat-tab label="{{ 'GENERAL_CONFIG.EXPANDABLE.HR_CONFIG' | translate }}">
      <!-- HR Config Section -->
      <form [formGroup]="hrConfigForm" (ngSubmit)="onSaveHrConfig()" class="form-section">
        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="hrConfigForm.invalid || !hrConfigFormEnabled">
            <mat-icon>save</mat-icon>
            <span>{{ 'GENERAL_CONFIG.ACTIONS.SAVE' | translate }}</span>
          </button>
          <button mat-stroked-button color="warn" type="button" (click)="onResetHrConfig()" [disabled]="!hrConfigFormEnabled">
            <mat-icon>undo</mat-icon>
            <span>{{ 'GENERAL_CONFIG.ACTIONS.RESET' | translate }}</span>
          </button>
          <button mat-stroked-button color="accent" type="button" (click)="enableHrConfigForm()" *ngIf="!hrConfigFormEnabled">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
        </div>
      </form>
      <!-- No generic type lists for HR for now -->
    </mat-tab>
    <mat-tab label="{{ 'GENERAL_CONFIG.EXPANDABLE.OTHER_CONFIG' | translate }}">
      <!-- Other Config Section -->
      <form [formGroup]="otherConfigForm" (ngSubmit)="onSaveOtherConfig()" class="form-section">
        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="otherConfigForm.invalid || !otherConfigFormEnabled">
            <mat-icon>save</mat-icon>
            <span>{{ 'GENERAL_CONFIG.ACTIONS.SAVE' | translate }}</span>
          </button>
          <button mat-stroked-button color="warn" type="button" (click)="onResetOtherConfig()" [disabled]="!otherConfigFormEnabled">
            <mat-icon>undo</mat-icon>
            <span>{{ 'GENERAL_CONFIG.ACTIONS.RESET' | translate }}</span>
          </button>
          <button mat-stroked-button color="accent" type="button" (click)="enableOtherConfigForm()" *ngIf="!otherConfigFormEnabled">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
        </div>
      </form>
      <!-- Removed generic type lists from here -->
    </mat-tab>
  </mat-tab-group>
</app-card>
