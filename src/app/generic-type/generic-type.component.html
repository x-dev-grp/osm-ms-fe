<div>
  <h2>Manage Types</h2>

  <!-- Dropdown for selecting type category -->
  <div>
    <label for="typeSelect">Select Type Category:</label>
    <select id="typeSelect" [(ngModel)]="selectedType" (change)="changeType()">
      <option *ngFor="let type of typeOptions" [value]="type">
        {{ type | titlecase }}
      </option>
    </select>
  </div>

  <!-- Display API response message -->
  <p>{{ message }}</p>

  <!-- Table to display records -->
  <table border="1" cellpadding="5" cellspacing="0">
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Description</th>
      <th>Created At</th>
      <th>Updated At</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let record of records">
      <td>{{ record.id }}</td>
      <td>{{ record.name }}</td>
      <td>{{ record.description }}</td>
      <td>{{ record.createdAt | date:'short' }}</td>
      <td>{{ record.updatedAt | date:'short' }}</td>
      <td>
        <button (click)="editRecord(record)">Edit</button>
        <button (click)="deleteRecord(record)">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Form for adding or editing a record -->
  <div style="margin-top: 20px;">
    <h3>{{ isEditing ? 'Edit Record' : 'Add Record' }}</h3>
    <div>
      <label>Name:</label>
      <input type="text" [(ngModel)]="selectedRecord.name" placeholder="Enter name">
    </div>
    <div>
      <label>Description:</label>
      <input type="text" [(ngModel)]="selectedRecord.description" placeholder="Enter description">
    </div>
    <div style="margin-top: 10px;">
      <button *ngIf="!isEditing" (click)="addRecord()">Add</button>
      <button *ngIf="isEditing" (click)="updateRecord()">Update</button>
      <button *ngIf="isEditing" (click)="cancelEdit()">Cancel</button>
    </div>
  </div>
</div>
