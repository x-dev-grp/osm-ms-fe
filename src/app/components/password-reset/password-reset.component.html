<div class="reset-password-container">
  <h2>Reset Your Password</h2>

  <form (ngSubmit)="onSubmit()" [formGroup]="resetPasswordForm">
    <div class="form-group">
      <label for="password">New Password</label>
      <input
        id="password"
        type="password"
        formControlName="newPassword"
        class="form-control"
        placeholder="Enter your new password"
        required
      />
      <div *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched">
        <small class="text-danger">Password is required and must be at least 8 characters long.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        class="form-control"
        placeholder="Confirm your new password"
        required
      />
      <div *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched">
        <small class="text-danger">Confirm password is required and must match the new password.</small>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="resetPasswordForm.invalid">
      Reset Password
    </button>
  </form>
</div>
