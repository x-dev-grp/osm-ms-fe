<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
        <mat-form-field appearance="fill" class="input-full-width">
          <mat-label>Username</mat-label>
          <input
            [(ngModel)]="username"
            matInput
            minlength="3"
            name="username"
            required
          />
          <mat-error
            *ngIf="
    loginForm?.controls?.['username']?.invalid &&
    loginForm?.controls?.['username']?.touched
  "
          > Username is required (min length: 3)
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="input-full-width">
          <mat-label>Password</mat-label>
          <input
            [(ngModel)]="password"
            matInput
            minlength="0"
            name="password"
            required
            type="password"
          />
          <mat-error
            *ngIf="
    loginForm?.controls?.['password']?.invalid &&
    loginForm?.controls?.['password']?.touched"
          > Password is required (min length: 0)
          </mat-error>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button
        (click)="onSubmit(loginForm)"
        [disabled]="loginForm?.invalid"
        color="primary"
        mat-raised-button
      >
        Login
      </button>
    </mat-card-actions>
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
  </mat-card>
</div>
