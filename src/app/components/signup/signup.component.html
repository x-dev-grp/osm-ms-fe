<div class="signup-container">
  <h2>Sign Up</h2>

  <form (ngSubmit)="onSubmit()" [formGroup]="signupForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        class="form-control"
        placeholder="Enter your username"
        required
      />
      <div *ngIf="signupForm.get('username')?.invalid && signupForm.get('username')?.touched">
        <small class="text-danger">Username is required and must be between 1 and 50 characters long.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="phone">Phone</label>
      <input
        id="phone"
        type="text"
        formControlName="phone"
        class="form-control"
        placeholder="Enter your phone number"
        required
      />
      <div *ngIf="signupForm.get('phone')?.invalid && signupForm.get('phone')?.touched">
        <small class="text-danger">Phone is required and must be between 1 and 50 characters long.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="form-control"
        placeholder="Enter your email"
        required
      />
      <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
        <small class="text-danger">Valid email is required (min 5, max 254 characters).</small>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="form-control"
        placeholder="Enter your password"
        required
      />
      <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
        <small class="text-danger">Password is required.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="firstName">First Name</label>
      <input
        id="firstName"
        type="text"
        formControlName="firstName"
        class="form-control"
        placeholder="Enter your first name"
      />
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input
        id="lastName"
        type="text"
        formControlName="lastName"
        class="form-control"
        placeholder="Enter your last name"
      />
    </div>

    <div class="form-group">
      <label for="langKey">Language</label>
      <input
        id="langKey"
        type="text"
        formControlName="langKey"
        class="form-control"
        placeholder="Enter your language (e.g., en)"
      />
    </div>

    <div class="form-group">
      <label for="activated">Activated</label>
      <input
        id="activated"
        type="checkbox"
        formControlName="activated"
        class="form-check-input"
      />
      <div *ngIf="signupForm.get('activated')?.invalid && signupForm.get('activated')?.touched">
        <small class="text-danger">Activated must be true/false.</small>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="signupForm.invalid">
      Sign Up
    </button>
  </form>
</div>
