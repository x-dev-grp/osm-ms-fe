<div class="auth-shell">
  <div class="auth-shell__aurora" aria-hidden="true">
    <span class="auth-shell__blob auth-shell__blob--a"></span>
    <span class="auth-shell__blob auth-shell__blob--b"></span>
    <span class="auth-shell__blob auth-shell__blob--c"></span>
    <span class="auth-shell__blob auth-shell__blob--d"></span>
  </div>
  <div class="auth-shell__glow" aria-hidden="true"></div>

  <div class="auth-shell__topbar">
    <app-auth-lang-switcher />
  </div>

  <div class="auth-shell__panel auth-shell__panel--single">
    <main class="auth-panel">
      <div class="auth-panel__card">
        <header class="auth-brand">
          <img [src]="appLogoFull" alt="ZitFlow" class="auth-brand__logo" />
          <span class="auth-brand__divider" aria-hidden="true"></span>
          <img src="assets/XDEV.svg" alt="XDEV" class="auth-brand__partner" />
        </header>

        <div class="auth-panel__heading">
          <h2>{{ 'FORGOT_PASSWORD.TITLE' | translate }}</h2>
          <p>{{ 'FORGOT_PASSWORD.SUBTITLE' | translate }}</p>
        </div>

        <div *ngIf="successMessage" class="auth-alert auth-alert--success" role="alert">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="auth-alert auth-alert--error" role="alert">{{ errorMessage }}</div>

        <form *ngIf="!successMessage" [formGroup]="form" class="auth-form" (ngSubmit)="submit()">
          <label class="auth-input" [class.auth-input--invalid]="form.controls['email'].touched && form.controls['email'].invalid">
            <span class="auth-input__label">{{ 'FORGOT_PASSWORD.EMAIL' | translate }}</span>
            <span class="auth-input__control">
              <mat-icon class="auth-input__icon" aria-hidden="true">mail_outline</mat-icon>
              <input formControlName="email" id="email" type="email" autocomplete="username" />
            </span>
            <span class="auth-input__error" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
              {{ getEmailErrorMessage() }}
            </span>
          </label>

          <button type="submit" mat-flat-button color="primary" class="auth-submit" [disabled]="loading || form.invalid">
            <mat-spinner *ngIf="loading" diameter="22"></mat-spinner>
            <span *ngIf="!loading">{{ 'FORGOT_PASSWORD.SUBMIT' | translate }}</span>
          </button>
        </form>

        <div class="auth-form__row" style="justify-content: center; margin-top: 8px">
          <a (click)="navigateToLogin()" class="auth-link">{{ 'FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}</a>
        </div>
      </div>
    </main>
  </div>
</div>
