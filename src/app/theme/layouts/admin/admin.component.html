<mat-drawer-container class="drawer-container" [dir]="direction">
  <mat-drawer
    #sidebar
    class="pc-sidebar"
    [mode]="modeValue"
    opened
    [ngClass]="{
      compact: currentLayout === 'compact',
      horizontal: currentLayout === 'horizontal'
    }"
  >
    <nav>
      <div class="navbar-wrapper">
        <div class="m-header">
          <a href="/welcome" class="flex align-item-center">
            <img
              [src]="logoPreview || 'assets/OSM.svg'"
              width="66"
              height="66"
              alt="OSM Logo"
               style="background: transparent;"
            />
            <a>
              v{{ currentApplicationVersion }}
            </a>
          </a>
        </div>
        @if (currentLayout === 'vertical' || currentLayout === 'compact') {
          <app-vertical-menu [menus]="menus" />
        }
      </div>
    </nav>
  </mat-drawer>
  <div>
    <app-nav-bar
      [ngClass]="{
        'horizontal-navbar': currentLayout === 'horizontal'
      }"
    />
    @if (currentLayout === 'horizontal') {
      <app-horizontal-menu
        [menus]="menus"
        [ngClass]="{
          'horizontal-menu': currentLayout === 'horizontal'
        }"
      />
    }
    <div class="app-container" [class.app-container--horizontal]="currentLayout === 'horizontal'">
      <app-breadcrumb [dashboard]="true" />
      <div class="main-body">
        <div class="page-wrapper">
          <router-outlet />
        </div>
      </div>
    </div>
    <app-footer></app-footer>
  </div>
</mat-drawer-container>
