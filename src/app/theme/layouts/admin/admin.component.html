<mat-drawer-container class="drawer-container" [dir]="direction">
  <mat-drawer
    #sidebar
    class="pc-sidebar"
    [mode]="modeValue"
    opened
    [ngClass]="{
      compact: currentLayout === 'compact',
      horizontal: currentLayout === 'horizontal'
    }"
  >
    <nav>
      <div class="navbar-wrapper">
        <div class="m-header sidebar-brand">
          <a routerLink="/welcome" class="sidebar-brand__link" [attr.aria-label]="'SIDEBAR.BRAND_HOME' | translate">
            <div class="sidebar-brand__logo-wrap">
              <img
                class="sidebar-brand__logo"
                [src]="logoPreview || 'assets/OSM.svg'"
                alt="Company logo"
              />
            </div>
            <div class="sidebar-brand__meta">
              <span class="sidebar-brand__company">{{ companyName || ('SIDEBAR.DEFAULT_COMPANY' | translate) }}</span>
              <span class="sidebar-brand__platform">{{ 'SIDEBAR.PLATFORM' | translate }}</span>
              <span class="sidebar-brand__version">v{{ currentApplicationVersion }}</span>
            </div>
          </a>
        </div>
        @if (currentLayout === 'vertical' || currentLayout === 'compact') {
          <app-vertical-menu [menus]="menus" [companyName]="companyName" />
        }
      </div>
    </nav>
  </mat-drawer>
  <div>
    <app-nav-bar
      [ngClass]="{
        'horizontal-navbar': currentLayout === 'horizontal'
      }"
    />
    @if (currentLayout === 'horizontal') {
      <app-horizontal-menu
        [menus]="menus"
        [ngClass]="{
          'horizontal-menu': currentLayout === 'horizontal'
        }"
      />
    }
    <div class="app-container" [class.app-container--horizontal]="currentLayout === 'horizontal'">
      <app-breadcrumb [dashboard]="true" />
      <div class="main-body">
        <div class="page-wrapper">
          <router-outlet />
        </div>
      </div>
    </div>
    <app-footer></app-footer>
  </div>
</mat-drawer-container>
