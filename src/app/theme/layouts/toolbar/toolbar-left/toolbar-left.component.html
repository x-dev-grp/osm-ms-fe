<div class="header-button">
  @if (showToggleMenu && !isMobileNav()) {
    <button
      mat-button
      class="header-item sidebar-collapse"
      type="button"
      (click)="toggleMenu()"
      aria-label="Menu"
    >
      <img
        class="sidebar-toggle-logo"
        [src]="appLogoMark"
        alt="ZitFlow"
        width="28"
        height="28"
      />
    </button>
  }
</div>
