<!-- access-denied.component.html -->
<div class="pc-container">
  <div class="pc-content">

    <!-- Hero -->
    <div class="card mb-4 text-center">
      <div class="card-body py-5">
        <div class="display-4 text-danger mb-2" [attr.title]="'ACCESS_DENIED.ICON_TITLE' | translate">
          <i class="feather icon-slash"></i>
        </div>

        <h2 class="mb-2">
          {{ 'ACCESS_DENIED.TITLE' | translate }}
        </h2>

        <p class="text-muted mb-0">
          {{ 'ACCESS_DENIED.MESSAGE' | translate }}
        </p>

        <button
          mat-flat-button
          type="button"
          class="btn btn-primary btn-lg px-4"
          (click)="goHome()"
          [attr.title]="'ACCESS_DENIED.GO_HOME_TITLE' | translate">
          <i class="feather icon-home"></i>
          <span class="ms-2">{{ 'ACCESS_DENIED.GO_HOME' | translate }}</span>
        </button>

        <button
          mat-flat-button
          routerLink="/help"
          class="btn btn-outline-secondary btn-lg px-4"
          [attr.title]="'ACCESS_DENIED.HELP_TITLE' | translate">
          <i class="feather icon-help-circle"></i>
          <span class="ms-2">{{ 'ACCESS_DENIED.HELP' | translate }}</span>
        </button>

        <button
          mat-flat-button
          routerLink="/login"
          class="btn btn-link text-danger"
          [attr.title]="'ACCESS_DENIED.LOGOUT_TITLE' | translate">
          <i class="feather icon-log-out"></i>
          <span class="ms-1">{{ 'ACCESS_DENIED.LOGOUT' | translate }}</span>
        </button>
      </div>
    </div>

  </div>
</div>
