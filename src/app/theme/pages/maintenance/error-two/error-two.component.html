<div class="maintenance-block">
  <div class="container">
    <div class="row">
      <div class="col-sm-12">
        <div class="error-card">
          <div class="error-card-content">
            <div class="error-image-block">
              <img src="assets/images/pages/img-error-500.svg" class="img-fluid" alt="img" />
            </div>
            <div class="error-text">
              <div class="m-t-50 f-38 f-w-700">{{ 'AUTO.INTERNAL_SERVER_ERROR' | translate }}</div>
              <div class="m-t-5 f-16 m-b-25 text-muted">

                {{ 'AUTO.SERVER_ERROR_500_WE_FIXING_THE_PROBLEM_PLEASE' | translate }}
                <br />

                {{ 'AUTO.TRY_AGAIN_AT_A_LATER_STAGE' | translate }}
              </div>
              <button mat-flat-button color="primary" [routerLink]="['/dashboard']">{{ 'PAGE_404.BACK_HOME' | translate }}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
