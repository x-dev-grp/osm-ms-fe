<app-card [showHeader]="false" [padding]="24">
  <div class="flex align-item-start justify-content-between">
    <div>
      <div class="f-16 f-w-600 m-b-5">{{ 'Statistics' | translate }}</div>
      <p class="text-muted f-w-500 m-b-10">{{ 'AUTO.REVENUE_AND_SALES' | translate }}</p>
    </div>
    <select class="form-select-sm" [(ngModel)]="selectType" (change)="onOptionSelected()">
      <option value="today">{{ 'DASHBOARD.DATE_FILTER.TODAY' | translate }}</option>
      <option value="week">{{ 'DASHBOARD.ANALYTICS.RECEPTION_TREND.WEEKLY' | translate }}</option>
      <option value="month">{{ 'DASHBOARD.ANALYTICS.RECEPTION_TREND.MONTHLY' | translate }}</option>
    </select>
  </div>
  <div id="chart">
    <apx-chart
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [dataLabels]="chartOptions.dataLabels"
      [legend]="chartOptions.legend"
      [xaxis]="chartOptions.xaxis"
      [colors]="chartOptions.colors"
      [stroke]="chartOptions.stroke"
      [grid]="chartOptions.grid"
      [tooltip]="chartOptions.tooltip"
      [markers]="chartOptions.markers"
      [fill]="chartOptions.fill"
    ></apx-chart>
  </div>
</app-card>
