<app-card [icon]="'add'" [cardTitle]="isEditing ? ('DEPARTMENT.EDIT_TITLE' | translate) : ('DEPARTMENT.ADD_TITLE' | translate)">
  <div class="form-container">
    <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-grid-item">
          <mat-form-field appearance="outline">
            <mat-label>{{ 'DEPARTMENT.NAME' | translate }}</mat-label>
            <input matInput formControlName="name" required>
            <mat-error>{{ getErrorMessage('name') }}</mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="form-grid full-width">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'DEPARTMENT.DESCRIPTION' | translate }}</mat-label>
          <textarea matInput formControlName="description" rows="3"></textarea>
        </mat-form-field>
      </div>
      <div class="form-grid full-width">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'DEPARTMENT.MANAGERID' | translate }}</mat-label>
          <textarea matInput formControlName="managerId" rows="3"></textarea>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-button type="button" (click)="onCancel()">
          {{ 'CANCEL' | translate }}
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="departmentForm.invalid || loading">
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">
                        {{ isEditing ? ('UPDATE' | translate) : ('SAVE' | translate) }}
                    </span>
        </button>
      </div>
    </form>
  </div>
</app-card>
