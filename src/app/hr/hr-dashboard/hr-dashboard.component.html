<app-dashboard-shell
  titleKey="HR.DASHBOARD.TITLE"
  subtitleKey="HR.DASHBOARD.SUBTITLE"
  icon="groups"
  theme="hr"
  [loading]="loading"
  [exportPayload]="exportPayload"
  (refresh)="refreshStats()"
>
  <div class="hr-kpi-grid">
    @for (kpi of kpiCards; track kpi.labelKey) {
      <article class="hr-kpi">
        <div class="hr-kpi__icon"><mat-icon>{{ kpi.icon }}</mat-icon></div>
        <div>
          <span class="hr-kpi__label">{{ kpi.labelKey | translate }}</span>
          <strong class="hr-kpi__value">{{ kpi.value }}</strong>
        </div>
      </article>
    }
  </div>

  <div class="hr-nav-grid">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" class="hr-nav-card" [ngClass]="'hr-nav-card--' + item.themeKey">
        <div class="hr-nav-card__icon">
          <mat-icon>{{ item.icon }}</mat-icon>
        </div>
        <div class="hr-nav-card__body">
          <h3>{{ item.titleKey | translate }}</h3>
          <p>{{ item.subtitleKey | translate }}</p>
        </div>
      </a>
    }
  </div>
</app-dashboard-shell>
