<div class="dashboard-shell hr-dashboard-page">
  <div class="page-header sticky-actions page-header--hr">
    <div class="page-header__left">
      <div class="header-icon-wrap header-icon-wrap--hr">
        <mat-icon>people</mat-icon>
      </div>
      <div>
        <h2 class="m-0 f-w-600">{{ 'HR.DASHBOARD.TITLE' | translate }}</h2>
        <p class="header-subtitle">{{ 'HR.DASHBOARD.SUBTITLE' | translate }}</p>
      </div>
    </div>
  </div>

  <div class="hr-nav-grid">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" class="hr-nav-card" [ngClass]="'hr-nav-card--' + item.themeKey">
        <div class="hr-nav-card__icon">
          <mat-icon>{{ item.icon }}</mat-icon>
        </div>
        <div class="hr-nav-card__body">
          <h3>{{ item.titleKey | translate }}</h3>
          <p>{{ item.subtitleKey | translate }}</p>
        </div>
      </a>
    }
  </div>
</div>
