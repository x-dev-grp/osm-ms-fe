<div class="qc-container" style="display: flex; width: 100%;">
  <!-- Table Area -->
  <div class="table-area" style="flex: 1; padding-right: 15px;">
    <app-card cardTitle="Quality Control Rule Management">
      <div class="p-t-15">
        <!-- Display API response message -->
        <p *ngIf="message">{{ message }}</p>

        <!-- Table of rules using Angular Material table -->
        <div class="table-responsive m-b-15">
          <table mat-table [dataSource]="FilterSource" class="mat-elevation-z8">
            <!-- Rule Key Column -->
            <ng-container matColumnDef="ruleKey">
              <th mat-header-cell *matHeaderCellDef>Rule Key</th>
              <td mat-cell *matCellDef="let rule">
                {{ rule.ruleKey }}
              </td>
            </ng-container>

            <!-- Oil QC Column (checkbox) -->
            <ng-container matColumnDef="isisOilQc">
              <th mat-header-cell *matHeaderCellDef>Oil QC</th>
              <td mat-cell *matCellDef="let rule">
                <!-- This checkbox is disabled and simply shows
                     whether the rule's oilQc is true or false -->
                <mat-checkbox [checked]="rule.oilQc" disabled>
                </mat-checkbox>
              </td>
            </ng-container>

            <!-- Rule Name Column -->
            <ng-container matColumnDef="ruleName">
              <th mat-header-cell *matHeaderCellDef>Rule Name</th>
              <td mat-cell *matCellDef="let rule">{{ rule.ruleName }}</td>
            </ng-container>

            <!-- Description Column -->
            <ng-container matColumnDef="description">
              <th mat-header-cell *matHeaderCellDef>Description</th>
              <td mat-cell *matCellDef="let rule">{{ rule.description }}</td>
            </ng-container>

            <!-- Min Value Column -->
            <ng-container matColumnDef="minValue">
              <th mat-header-cell *matHeaderCellDef>Min Value</th>
              <td mat-cell *matCellDef="let rule">{{ rule.minValue }}</td>
            </ng-container>

            <!-- Max Value Column -->
            <ng-container matColumnDef="maxValue">
              <th mat-header-cell *matHeaderCellDef>Max Value</th>
              <td mat-cell *matCellDef="let rule">{{ rule.maxValue }}</td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let rule">
                <button mat-icon-button color="primary" (click)="openFormForEdit(rule)" matTooltip="Edit">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteRule(rule)" matTooltip="Delete">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </div>
      </div>
    </app-card>

    <div class="m-t-20 text-right">
      <button mat-flat-button color="primary" (click)="openForm()">Add Rule</button>
    </div>
  </div>

  <!-- Vertical Form Panel -->
  <div class="form-area" *ngIf="formOpen" style="width: 350px; border-left: 1px solid #ccc; padding: 15px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>{{ isEditing ? 'Edit Rule' : 'Add Rule' }}</h3>
      <button mat-icon-button (click)="closeForm()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form class="rule-form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="w-100 m-b-10">
        <mat-label>Rule Key</mat-label>
        <input
          matInput
          [(ngModel)]="selectedRule.ruleKey"
          name="ruleKey"
          placeholder="Enter rule key"
          required
        />
      </mat-form-field>

      <!-- Oil QC Checkbox in the form -->
      <div class="form-row m-b-10">
        <mat-checkbox [(ngModel)]="selectedRule.oilQc" name="oilQc">
          Oil QC
        </mat-checkbox>
      </div>

      <mat-form-field appearance="outline" class="w-100 m-b-10">
        <mat-label>Rule Name</mat-label>
        <input
          matInput
          [(ngModel)]="selectedRule.ruleName"
          name="ruleName"
          placeholder="Enter rule name"
          required
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 m-b-10">
        <mat-label>Description</mat-label>
        <input
          matInput
          [(ngModel)]="selectedRule.description"
          name="description"
          placeholder="Enter description"
        />
      </mat-form-field>

      <div class="form-row" style="display: flex; justify-content: space-between;">
        <mat-form-field appearance="outline" class="w-45 m-r-5 m-b-10">
          <mat-label>Min Value</mat-label>
          <input
            matInput
            type="number"
            [(ngModel)]="selectedRule.minValue"
            name="minValue"
            placeholder="Enter min value"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-45 m-b-10">
          <mat-label>Max Value</mat-label>
          <input
            matInput
            type="number"
            [(ngModel)]="selectedRule.maxValue"
            name="maxValue"
            placeholder="Enter max value"
          />
        </mat-form-field>
      </div>

      <div class="form-row m-t-10" style="display: flex; gap: 10px;">
        <button mat-flat-button color="primary" type="submit">
          {{ isEditing ? 'Update Rule' : 'Add Rule' }}
        </button>
        <button
          *ngIf="isEditing"
          mat-stroked-button
          color="accent"
          type="button"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
