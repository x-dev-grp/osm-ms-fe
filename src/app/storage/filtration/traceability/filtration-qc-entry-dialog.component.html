<h2 mat-dialog-title>{{ 'AUTO.CONTROLE_QUALITE_APRES_FILTRATION' | translate }}</h2>

<mat-dialog-content>
  <app-qc-entry-studio
    context="FILTRATION"
    [filtrationOperationId]="data.filtrationOperationId"
    [traceabilityLotId]="data.traceabilityLotId"
    [compact]="true"
    (saved)="onSaved()"
  />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'ADMIN.CANCEL' | translate }}</button>
</mat-dialog-actions>
