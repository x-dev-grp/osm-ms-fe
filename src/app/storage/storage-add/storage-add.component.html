<app-card
  [cardTitle]="isEditing ? 'Edit Storage Unit' : 'Add Storage Unit'"
  [icon]="'inventory_2'"
>
  <div class="form-container">
    <form
      class="storage-form"
      [formGroup]="storageForm"
      (ngSubmit)="save()"
      [class.loading]="loading"
      autocomplete="off"
      novalidate
    >
      <!-- Row 1 -->
      <mat-form-field appearance="outline" class="field">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" required />
        <mat-error *ngIf="storageForm.get('name')?.hasError('required')">
          Name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="field">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status" required>
          <mat-option value="AVAILABLE">Available</mat-option>
          <mat-option value="FULL">Full</mat-option>
          <mat-option value="FILLING">Filling</mat-option>
          <mat-option value="MAINTENANCE">Maintenance</mat-option>
          <mat-option value="IN_USE">In Use</mat-option>
          <mat-option value="CLEANING">Cleaning</mat-option>
          <mat-option value="RESERVED">Reserved</mat-option>
          <mat-option value="OUT_OF_SERVICE">Out of Service</mat-option>
        </mat-select>
        <mat-error *ngIf="storageForm.get('status')?.hasError('required')">
          Status is required
        </mat-error>
      </mat-form-field>

      <!-- Row 2 -->
      <mat-form-field appearance="outline" class="field">
        <mat-label>Max Capacity</mat-label>
        <input matInput type="number" formControlName="maxCapacity" required />
        <span matSuffix>kg&nbsp;</span>
        <mat-error *ngIf="storageForm.get('maxCapacity')?.hasError('required')">
          Max capacity is required
        </mat-error>
        <mat-error *ngIf="storageForm.get('maxCapacity')?.hasError('min')">
          Must be greater than 0
        </mat-error>
      </mat-form-field>

      <!-- New Row for Filtered Oil checkbox -->
      <div class="field checkbox-field">
        <mat-checkbox formControlName="filteredOil" color="primary">
          Filtered Oil
        </mat-checkbox>
      </div>

      <!-- Description (full width) -->
      <mat-form-field appearance="outline" class="field span-2">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <!-- Actions -->
      <div class="form-actions span-2">
        <button mat-stroked-button type="button" (click)="onBack()">Cancel</button>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="loading || storageForm.invalid"
        >
          {{ isEditing ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</app-card>
