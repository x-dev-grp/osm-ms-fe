<!doctype html>
<html lang="fr">
  <head>
    <title>OOSM | XDEV</title>
    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0, minimal-ui" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="OOSM Management System - Oil and Olive Management" />
    <meta name="theme-color" content="#1976d2" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OOSM" />

    <link rel="icon" type="image/png" href="favicon.ico" />

  </head>
  <body class="mat-typography">
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('app_language');
          if (lang === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
            document.body.classList.add('able-pro-rtl');
          } else if (lang === 'en' || lang === 'fr') {
            document.documentElement.lang = lang;
            document.documentElement.dir = 'ltr';
          }
        } catch (e) {}
      })();
    </script>
    <script>window.global = window;</script>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
